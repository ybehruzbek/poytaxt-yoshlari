# yoshkent.uz: v2 ga push qilinganda sayt GitHub'da yiğiladi (server yiğişga yetmaydi — xotira kam),
# tayyor image ghcr.io ga joylanadi va Dokploy webhook orqali yangilanadi.
# Dokploy ilovasi: Provider — Docker, image ghcr.io/ybehruzbek/poytaxt-yoshlari:latest.
# Repo sozlamasida secret: DOKPLOY_WEBHOOK — Dokploy → ilova → Deployments → Webhook URL (yöq bölsa faqat yiğiladi).
name: Deploy (yoshkent.uz)

on:
  push:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: deploy-yoshkent
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # faqat v2 dan (qöl bilan işga tuşirilganda ham boşqa tarmoq production'ga çiqmaydi)
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/ybehruzbek/poytaxt-yoshlari
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Yiğiş va ghcr.io ga joylaş
        id: build1
        # GitHub serverida vaqti-vaqti bilan tarmoq uzilişi (masalan, Google şriftlarini yuklaş) yiğişni
        # yiqitadi — bunda keyingi qadam bir marta qayta urinadi
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://yoshkent.uz
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=deploy-v2
          cache-to: type=gha,mode=min,scope=deploy-v2

      - name: Yiğiş — qayta uriniş
        if: steps.build1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://yoshkent.uz
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=deploy-v2
          cache-to: type=gha,mode=min,scope=deploy-v2

      - name: Dokploy'da yangilaş
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then echo "DOKPLOY_WEBHOOK yöq — faqat yiğildi"; exit 0; fi
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' "$DOKPLOY_WEBHOOK"
